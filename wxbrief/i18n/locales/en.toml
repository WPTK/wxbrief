# English catalog: the reference every other language is checked against.
# Keys are dotted and semantic; values use str.format placeholders. A table with only plural categories
# (one/other) is a plural entry. Unit symbols, ICAO codes, runway designators and raw tokens are never translated.

[meta]
language = "English"
status = "complete"
plural_rule = "one_other"
decimal = "."
group = ","
clock = "24h"

[label]
report = "Report"
station = "Station"
observed = "Observed"
category = "Flight category"
wind = "Wind"
visibility = "Visibility"
rvr = "Runway visual range"
weather = "Weather"
sky = "Sky"
ceiling = "Ceiling"
temperature = "Temperature"
dewpoint = "Dew point"
humidity = "Relative humidity"
altimeter = "Pressure"
tail = "Trend and other groups (raw)"
remarks = "Remarks (raw)"
flags = "Flags"
summary = "Summary"
modifiers = "Notes"

[common]
not_reported = "Not reported"
more_than = "more than {value}"
less_than = "less than {value}"
or_more = "at least {value}"
and_pair = "{first} and {second}"
and_list = "{head}, and {last}"

[time]
utc = "{value} UTC"
unresolved = "Not available"

[report]
METAR = "Routine observation (METAR)"
SPECI = "Special observation (SPECI)"

[modifier]
AUTO = "Automated observation"
COR = "Corrected report"
CCA = "Corrected report (first correction)"
CCB = "Corrected report (second correction)"
CCC = "Corrected report (third correction)"
RTD = "Delayed report"
NIL = "No report available (NIL)"
AMD = "Amended report"
CNL = "Cancelled report"

[compass]
N = "N"
NNE = "NNE"
NE = "NE"
ENE = "ENE"
E = "E"
ESE = "ESE"
SE = "SE"
SSE = "SSE"
S = "S"
SSW = "SSW"
SW = "SW"
WSW = "WSW"
W = "W"
WNW = "WNW"
NW = "NW"
NNW = "NNW"

[wind]
calm = "Calm"
steady = "From {direction}° ({compass}) at {speed}"
variable = "Variable direction at {speed}"
no_direction = "Direction not reported, {speed}"
not_reported = "Not reported"
gust = "{base}, gusting to {gust}"
variation = "{base}; direction varies between {from_deg}° and {to_deg}°"

[vis]
cavok = "CAVOK: visibility {visibility}, no cloud below {height}, no significant weather"
not_reported = "Not reported"
ndv = "no directional variation"
with_ndv = "{base}, {ndv}"
directional = "{value} toward {compass}"
lowest = "{base}; lowest {minimum}"

[rvr]
runway = "Runway {runway}: {value}"
not_reported = "not reported"
range = "varying between {low} and {high}"
with_trend = "{base}, {trend}"

[rvr.trend]
UP = "increasing"
DOWN = "decreasing"
NO_CHANGE = "no change"

[wx]
none = "No significant weather"
not_observed = "Not observed"
tornado = "tornado or waterspout"
vicinity = "{body} in the vicinity"
with_intensity = "{intensity} {body}"

[wx.intensity]
LIGHT = "light"
HEAVY = "heavy"

[wx.descriptor]
