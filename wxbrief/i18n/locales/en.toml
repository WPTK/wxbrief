# English catalog: the reference every other language is checked against.
# Keys are dotted and semantic; values use str.format placeholders. A table with only plural categories
# (one/other) is a plural entry. Unit symbols, ICAO codes, runway designators and raw tokens are never translated.

[meta]
language = "English"
status = "complete"
plural_rule = "one_other"
decimal = "."
group = ","
clock = "24h"

