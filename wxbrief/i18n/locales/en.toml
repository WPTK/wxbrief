[cli]
description = "Terminal METAR/TAF briefing with colorways and plain-language translation. Give station ids to watch them for this run; saved stations load from the config."
epilog = "commands: decode (decode text without the TUI), get (fetch once and print). Run 'wxbrief decode --help' or 'wxbrief get --help'."
no_metar = "{icao}: no METAR in the last 2 hours"

[cli.help]
stations = "station ids to add for this run"
theme = "colourway for this run, such as paper-chart (not saved; default: from config, textual-dark)"
glyphs = "glyph set (default: from config, nerd)"
layout = "list or grid layout (v toggles it)"
units = "units mode"
time = "time shown: station, local or zulu"
lang = "language of the plain-language text: {languages} (default: from config, en; decode and get: en)"
config = "read and save this config file"
no_config = "ignore the config file and never write it"
demo = "open with the bundled sample reports of ten stations: fully offline, nothing is fetched, cached or saved"
decode = "decode METAR, SPECI and TAF text given as arguments or on stdin"
decode_description = "Decode METAR, SPECI and TAF reports into plain language. Pass each report as one quoted argument (unquoted words are joined into a single report), or pipe text on stdin: a blob with several reports, TAFs wrapped over several lines, reports separated by blank lines or '=', in upper or lower case. A group such as -RA is read as an option unless the report is quoted or follows --."
raw = "raw report text"
plain = "plain text without colour (automatic when stdout is not a terminal)"
json = "print the decoded reports as a JSON list (language-neutral: codes, numbers, UTC times)"
discord = "print each report as a Discord code block (inside an outer four-backtick fence); imperial units unless --units says otherwise"
units_mode = "us or metric units first, or mixed: as reported with the other system in parentheses (default: mixed, or us with --discord)"
date = "date used to resolve the day of the month in the report's timestamp (default: now, UTC)"
decode_theme = "colourway for the coloured terminal output, such as paper-chart (default: the built-in palette)"
lang_command = "language of the plain-language text: {languages} (default: en)"
get = "fetch the latest METAR and TAF for stations and print them"
get_description = "Fetch the latest METAR/SPECI and TAF from aviationweather.gov once and print the decode."
get_stations = "station ids (ICAO, or a unique IATA/FAA code)"
get_json = "machine-readable output"
get_discord = "Discord code blocks (imperial units unless --units says otherwise)"
get_plain = "plain text"

