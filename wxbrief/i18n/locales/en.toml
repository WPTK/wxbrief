[ui.add]
title = "Add station: ICAO or IATA code, or part of the name"
placeholder = "KDEN, DEN, heathrow ..."
hint = "Enter adds the first match   Down picks another   Esc cancels"
listed = "(listed)"

[ui.paste]
reference = "Reference date (YYYY-MM-DD):"
prompt = "Paste a METAR or TAF above. Several reports at once are fine."
bad_date = "Reference date not understood; using now."

[ui.themes]
title = "Theme"
hint = "Up/Down previews, Enter keeps, Esc cancels"

[ui.help]
title = "wxbrief keys"
hint = "Esc closes"
body = """\
[b]Stations[/b]
  Up/Down  j/k       select a station
  Enter              move into the detail pane
  a                  add a station (code or name)
  d                  remove the selected station
  r                  refresh now
  v                  toggle the list / grid layout
[b]Detail[/b]
  1  2  3            jump to raw, decoded, forecast
  Left/Right         move the forecast timeline cursor (the mouse works too)
  c                  copy the Discord METAR block
  C                  copy Discord METAR and TAF
  y                  copy the raw report text
[b]Tools[/b]
  t                  next theme (saved unless --theme or --no-config is used)
  T                  pick a theme, with a live preview
  g  u  z            next glyph set, units, time mode
  p                  paste and decode any METAR or TAF (offline)
  S                  settings: language, units, time, glyphs
  ?                  this help
  q                  quit
[b]Paste screen[/b]
  c (outside the box) or F2   copy the Discord block
  Esc                         back
"""

