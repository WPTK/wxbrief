[ui.help]
title = "Touches de wxbrief"
hint = "Échap ferme"
body = """\
[b]Stations[/b]
  Haut/Bas  j/k      choisir une station (grille : flèches sur les cartes ; j/k aussi sans liste)
  Entrée             entrer dans le panneau de détail (grille : ouvrir la station)
  a                  ajouter une station (code ou nom)
  d                  retirer la station choisie
  r                  actualiser maintenant
  v                  basculer l'affichage liste / grille
[b]Détail[/b]
  1  2  3            aller à l'original, au décodé, à la prévision
  Gauche/Droite      déplacer le curseur de la frise (la souris aussi)
  c                  copier le bloc METAR pour Discord
  C                  copier METAR et TAF pour Discord
  y                  copier le texte d'origine du message
[b]Outils[/b]
  t                  thème suivant (enregistré sauf avec --theme ou --no-config)
  T                  choisir un thème, avec aperçu
  g  u  z            jeu de symboles, unités, mode d'heure suivants
  p                  coller et décoder n'importe quel METAR ou TAF (hors ligne)
  S                  réglages : langue, unités, heure, symboles
  ?                  cette aide
  q                  quitter
[b]Écran de collage[/b]
  c (hors du champ) ou F2   copier le bloc pour Discord
  Échap                     retour
"""

