[ui.help]
title = "Teclas do wxbrief"
hint = "Esc fecha"
body = """\
[b]Estações[/b]
  Acima/Abaixo   j/k   escolher uma estação (grade: setas sobre os cartões; j/k também sem lista)
  Enter              entrar no painel de detalhes (grade: abrir a estação)
  a                  adicionar uma estação (código ou nome)
  d                  remover a estação escolhida
  r                  atualizar agora
  v                  alternar entre exibição em lista e em grade
[b]Detalhes[/b]
  1  2  3            ir para original, decodificado, previsão
  Esq./Dir.          mover o cursor da linha do tempo (o mouse também serve)
  c                  copiar o bloco do METAR para o Discord
  C                  copiar METAR e TAF para o Discord
  y                  copiar o texto original da mensagem
[b]Ferramentas[/b]
  t                  próximo tema (salvo, exceto com --theme ou --no-config)
  T                  escolher um tema, com prévia
  g  u  z            próximo conjunto de símbolos, unidades, modo de hora
  p                  colar e decodificar qualquer METAR ou TAF (off-line)
  S                  ajustes: idioma, unidades, hora, símbolos
  ?                  esta ajuda
  q                  sair
[b]Tela de colar[/b]
  c (fora da caixa) ou F2   copiar o bloco para o Discord
  Esc                       voltar
"""

