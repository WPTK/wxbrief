[ui.help]
title = "Teclas de wxbrief"
hint = "Esc cierra"
body = """\
[b]Estaciones[/b]
  Arriba/Abajo  j/k  elegir una estación
  Intro              entrar en el panel de detalle
  a                  añadir una estación (código o nombre)
  d                  quitar la estación elegida
  r                  actualizar ahora
  v                  alternar la disposición lista / cuadrícula
[b]Detalle[/b]
  1  2  3            ir al original, decodificado, pronóstico
  Izq./Der.          mover el cursor de la línea de tiempo (el ratón también sirve)
  c                  copiar el bloque de METAR para Discord
  C                  copiar METAR y TAF para Discord
  y                  copiar el texto original del informe
[b]Herramientas[/b]
  t                  tema siguiente (se guarda salvo con --theme o --no-config)
  T                  elegir un tema, con vista previa
  g  u  z            siguiente juego de símbolos, unidades, modo de hora
  p                  pegar y decodificar cualquier METAR o TAF (sin conexión)
  S                  ajustes: idioma, unidades, hora, símbolos
  ?                  esta ayuda
  q                  salir
[b]Pantalla de pegado[/b]
  c (fuera del cuadro) o F2   copiar el bloque para Discord
  Esc                         volver
"""

