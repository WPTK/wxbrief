[ui.help]
title = "wxbrief-Tasten"
hint = "Esc schließt"
body = """\
[b]Stationen[/b]
  Hoch/Runter  j/k   eine Station wählen (Raster: Pfeile über die Karten; j/k auch ohne Liste)
  Enter              ins Detailfenster wechseln (Raster: die Station öffnen)
  a                  eine Station hinzufügen (Code oder Name)
  d                  die gewählte Station entfernen
  r                  jetzt aktualisieren
  v                  zwischen Listen- und Rasteransicht wechseln
[b]Details[/b]
  1  2  3            zu Original, Dekodiert, Vorhersage springen
  Links/Rechts       den Zeitleistencursor bewegen (die Maus geht auch)
  c                  den METAR-Block für Discord kopieren
  C                  METAR und TAF für Discord kopieren
  y                  den Originaltext der Meldung kopieren
[b]Werkzeuge[/b]
  t                  nächstes Design (gespeichert, außer mit --theme oder --no-config)
  T                  ein Design wählen, mit Vorschau
  g  u  z            nächster Symbolsatz, nächste Einheiten, Zeitmodus
  p                  ein beliebiges METAR oder TAF einfügen und dekodieren (offline)
  S                  Einstellungen: Sprache, Einheiten, Zeit, Symbole
  ?                  diese Hilfe
  q                  beenden
[b]Einfüge-Bildschirm[/b]
  c (außerhalb des Felds) oder F2   den Block für Discord kopieren
  Esc                               zurück
"""

