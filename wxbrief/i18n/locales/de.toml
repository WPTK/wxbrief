# Deutscher Katalog. Schlüssel und {name}-Platzhalter stammen aus en.toml; Einheitensymbole, ICAO-Codes,
# Pistenbezeichnungen und Originalgruppen werden nicht übersetzt.

[meta]
language = "Deutsch"
status = "seeded"
plural_rule = "one_other"
decimal = ","
group = "."
clock = "24h"
keep_case = true
# first words that are not nouns, so they lose their capital in the middle of a sentence ("Wind aus 240°")
lowercase_starts = [
    "Ab", "Alle", "Alte", "Auf", "Aufgehobene", "Aufgelockerte", "Aus", "Automatische", "Bedeckt", "Berichtigte",
    "Böiger", "Das", "Dauerhafte", "Der", "Die", "Diese", "Einige", "Es", "Flacher", "Gefrierender", "Geringe", "Geänderte", "Hohes",
    "In", "Kein", "Keine", "Konnte", "Nicht", "Niedrige", "Niedriges", "Teilweise", "Verspätete", "Veränderliche", "Vorübergehend",
    "Vorübergehende", "Wenige", "Windstill", "Wolkenfrei", "Wolkenlos", "Zeitweise", "Überwiegend",
]

