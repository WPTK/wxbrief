name: Release

# Runs only when a tag named v* is pushed. Nothing is published before that: no push to a branch and no pull request
# starts it. See docs/release.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag against the version and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' wxbrief/__init__.py)
          if [ -z "$version" ]; then echo "::error::no __version__ in wxbrief/__init__.py"; exit 1; fi
          if ! printf '%s' "$TAG" | grep -Eq '^v0\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $TAG is not v0.MINOR.PATCH"; exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match __version__ $version"; exit 1
          fi
          awk -v v="$version" 'index($0, "## " v " - ") == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version - YYYY-MM-DD' section with entries"; exit 1
          fi
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  dist:
    name: Wheel and sdist
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "build>=1,<2"
      - run: python -m build --outdir dist
      - name: Check the wheel installs and runs
        run: |
          python -m venv wheel-check
          wheel-check/bin/python -m pip install dist/*.whl
          wheel-check/bin/wxbrief --version
          wheel-check/bin/wxbrief --selftest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  binary:
    name: Binary (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # The Linux builds run on Debian 11 so the binaries need only an old glibc.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
          - name: linux-x86_64
            runner: ubuntu-latest
            container: python:3.12-bullseye
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            container: python:3.12-bullseye
          - name: macos-arm64
            runner: macos-latest
          - name: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.container == ''
        with:
          python-version: "3.12"
      # `binary` adds tzdata so every binary carries its own zone files.
      - run: python -m pip install ".[binary]" "pyinstaller>=6.22,<7"
      - run: python -m PyInstaller wxbrief.spec --noconfirm --clean --workpath .pyi-build --distpath dist
      - name: Smoke test
        shell: bash
        run: |
          exe=dist/wxbrief
          if [ "$RUNNER_OS" = Windows ]; then exe=dist/wxbrief.exe; fi
          "$exe" --version
          "$exe" --selftest
      - name: Name the file
        shell: bash
        env:
          NAME: ${{ matrix.name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' wxbrief/__init__.py)
          mkdir out
          if [ "$RUNNER_OS" = Windows ]; then
            cp dist/wxbrief.exe "out/wxbrief-$version-$NAME.exe"
          else
            chmod +x dist/wxbrief
            tar -C dist -czf "out/wxbrief-$version-$NAME.tar.gz" wxbrief
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Create the GitHub release
    needs: [verify, dist, binary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: parts
      - name: Collect the files and write SHA256SUMS
        run: |
          mkdir release
          cp parts/dist/* parts/binary-*/* release/
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*
            !release/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file parts/release-notes/notes.md
