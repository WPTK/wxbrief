name: Release

# Runs only when a tag named v* is pushed. Nothing is published before that: no push to a branch and no pull request
# starts it. See docs/release.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag commit is on main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::the tagged commit is not on main"; exit 1
          fi
      # CI runs on every push to main, so the tagged commit has a run unless the push touched only docs, the changelog
      # or the licence. Then tag a commit that CI ran on, or run CI by hand first.
      - name: Check CI passed on the tagged commit
        env:
          TAG_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$TAG_SHA" --status success --json databaseId --jq length)
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::no successful CI run for $TAG_SHA; wait for CI on main to finish and pass, then tag again"; exit 1
          fi
      - name: Check the tag against the version and the changelog
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' wxbrief/__init__.py)
          if [ -z "$version" ]; then echo "::error::no __version__ in wxbrief/__init__.py"; exit 1; fi
          if ! printf '%s' "$TAG" | grep -Eq '^v0\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $TAG is not v0.MINOR.PATCH"; exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match __version__ $version"; exit 1
          fi
          awk -v v="$version" 'index($0, "## " v " - ") == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version - YYYY-MM-DD' section with entries"; exit 1
          fi
          cat notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  dist:
    name: Wheel and sdist
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -c .github/release-constraints.txt "build>=1,<2"
      - run: python -m build --outdir dist
      - name: Check the wheel installs and runs
        run: |
          python -m venv wheel-check
          wheel-check/bin/python -m pip install -c .github/release-constraints.txt dist/*.whl
          wheel-check/bin/wxbrief --version
          wheel-check/bin/wxbrief --selftest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # The five binaries are built by binaries.yml, which also runs on pull requests that touch the build.
  binary:
    name: Binaries
    needs: verify
    uses: ./.github/workflows/binaries.yml

  # The file set and the tag are checked before anything is attested, so no signed claim is made about a moved tag or a
  # stray file. publish repeats both checks.
  check:
    name: Check the files and the tag
    needs: [verify, dist, binary]
    uses: WPTK/release-workflows/.github/workflows/check-release.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      expected-files: |
        wxbrief-${{ needs.verify.outputs.version }}-py3-none-any.whl
        wxbrief-${{ needs.verify.outputs.version }}.tar.gz
        wxbrief-${{ needs.verify.outputs.version }}-windows-x86_64.exe
        wxbrief-${{ needs.verify.outputs.version }}-linux-x86_64.tar.gz
        wxbrief-${{ needs.verify.outputs.version }}-linux-arm64.tar.gz
        wxbrief-${{ needs.verify.outputs.version }}-macos-arm64.tar.gz
        wxbrief-${{ needs.verify.outputs.version }}-macos-x86_64.tar.gz

  # Provenance is made here, in this workflow, and not in the shared publish workflow: the certificate names the workflow
  # that ran the step, and `gh attestation verify --signer-workflow` (post-release.yml, docs/release.md) expects this file.
  # It attests the same artifacts the publish job releases.
  attest:
    name: Attest build provenance
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

  publish:
    name: Create the GitHub release
    needs: [verify, dist, binary, attest]
    permissions:
      contents: write
    uses: WPTK/release-workflows/.github/workflows/publish-release.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      expected-files: |
        wxbrief-${{ needs.verify.outputs.version }}-py3-none-any.whl
        wxbrief-${{ needs.verify.outputs.version }}.tar.gz
        wxbrief-${{ needs.verify.outputs.version }}-windows-x86_64.exe
        wxbrief-${{ needs.verify.outputs.version }}-linux-x86_64.tar.gz
        wxbrief-${{ needs.verify.outputs.version }}-linux-arm64.tar.gz
        wxbrief-${{ needs.verify.outputs.version }}-macos-arm64.tar.gz
        wxbrief-${{ needs.verify.outputs.version }}-macos-x86_64.tar.gz

  # Uploads the wheel and sdist that the `dist` job built and checked (not rebuilt). Runs only after the GitHub release
  # exists, so a tag that failed any gate never reaches PyPI. The `pypi` environment holds the trusted publisher.
  pypi:
    name: Upload to PyPI
    needs: [verify, dist, binary, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
