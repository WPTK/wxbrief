name: Binaries

# Builds the one-file binary on each platform with PyInstaller and smoke-tests it (--version, --selftest). The build is
# the shared one in WPTK/release-workflows. Called by release.yml on a tag; also runs by hand (workflow_dispatch) and on
# pull requests that touch the build, so a broken spec shows up before a release rather than during one. Nothing here
# publishes anything and there are no secrets.
#
# Assets: wxbrief-<version>-<os>-<arch>, .exe on Windows and .tar.gz elsewhere (an artifact upload drops the executable
# bit and an archive keeps it; the archive holds one file named wxbrief).

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - wxbrief.spec
      - scripts/build_exe.ps1
      - pyproject.toml
      - wxbrief/**
      - .github/release-constraints.txt
      - .github/workflows/binaries.yml

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' wxbrief/__init__.py)
          [ -n "$version" ] || { echo "::error::no __version__ in wxbrief/__init__.py"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The Linux builds run inside python:3.12-bullseye, pinned by digest, so the binaries need only glibc 2.31 (Ubuntu
  # 20.04, Debian 11 and newer); building on the runner itself would set the floor at that runner's glibc. Move the pin
  # on purpose, and update the glibc note in README.md with it. macos-15-intel is GitHub's last Intel image. `.[binary]`
  # adds tzdata so every binary carries its own zone files. Everything installs from the pins in
  # .github/release-constraints.txt, so a dependency release between two tags cannot change what ships.
  binary:
    name: Binary
    needs: version
    uses: WPTK/release-workflows/.github/workflows/build-binaries.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      app: wxbrief
      asset-prefix: wxbrief-${{ needs.version.outputs.version }}
      linux-container: python:3.12-bullseye@sha256:7cc929040c5e8cf6036c5099d62a83708427c131fb7a7c965b5ba51e995eea1c
      install-command: python -m pip install -c .github/release-constraints.txt ".[binary]" "pyinstaller>=6.22,<7"
      build-command: python -m PyInstaller wxbrief.spec --noconfirm --clean --workpath .pyi-build --distpath dist
      smoke-command: |
        "$BIN" --version
        "$BIN" --selftest
