name: Post-release

# Downloads the files that were PUBLISHED on the GitHub release (not build output), verifies them and runs the
# executable the way a user would. A failure here means the release is broken for users: it fails loudly.
#
# Triggers: `release: published` fires for releases made by a person or a token of one. The Release workflow creates
# its release with GITHUB_TOKEN, and GitHub does not start workflows from events made by that token, so the check also
# runs when the Release workflow finishes (`workflow_run`). A manual run takes the tag as input.

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check, for example v0.3.0
        required: true

permissions:
  contents: read

concurrency:
  group: post-release-${{ github.event.release.tag_name || github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  tag:
    name: Resolve the tag
    # A workflow_run for a failed Release run published nothing, so there is nothing to check.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-${RUN_TAG:-$INPUT_TAG}}"
          if ! printf '%s' "$tag" | grep -Eq '^v0\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a v0.MINOR.PATCH release tag"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  # The shared workflow downloads every published file, checks SHA256SUMS and each attestation (signed by this
  # repository's release.yml), then runs each binary on a runner of its own kind with nothing of ours installed.
  published:
    name: Published files and binaries
    needs: tag
    permissions:
      contents: read
      attestations: read
    uses: WPTK/release-workflows/.github/workflows/verify-published.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      tag: ${{ needs.tag.outputs.tag }}
      app: wxbrief
      asset-prefix: wxbrief-${{ needs.tag.outputs.version }}
      expected-files: |
        wxbrief-${{ needs.tag.outputs.version }}-py3-none-any.whl
        wxbrief-${{ needs.tag.outputs.version }}.tar.gz
        wxbrief-${{ needs.tag.outputs.version }}-windows-x86_64.exe
        wxbrief-${{ needs.tag.outputs.version }}-linux-x86_64.tar.gz
        wxbrief-${{ needs.tag.outputs.version }}-linux-arm64.tar.gz
        wxbrief-${{ needs.tag.outputs.version }}-macos-arm64.tar.gz
        wxbrief-${{ needs.tag.outputs.version }}-macos-x86_64.tar.gz
      smoke-command: |
        out=$("$BIN" --version | tr -d '\r'); echo "$out"
        [ "$out" = "wxbrief ${{ needs.tag.outputs.version }}" ] || { echo "::error::expected 'wxbrief ${{ needs.tag.outputs.version }}'"; exit 1; }
        "$BIN" --selftest

  run:
    name: Run the published executable (${{ matrix.os }})
    needs: tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64.tar.gz
          - os: windows-latest
            asset: windows-x86_64.exe
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      # The checkout supplies only the pseudo-terminal driver (tests/uat_kit) and this script; the executable is the
      # downloaded one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "tui-test==0.1.1" psutil
      - name: Download the published file and verify its checksum
        run: |
          mkdir bin && cd bin
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          name="wxbrief-$VERSION-${{ matrix.asset }}"
          curl -fsSL --retry 3 -O "$base/SHA256SUMS"
          curl -fsSL --retry 3 -O "$base/$name" || { echo "::error::cannot download $name"; exit 1; }
          grep -F " $name" SHA256SUMS > one.sum || { echo "::error::$name is not listed in SHA256SUMS"; exit 1; }
          sha256sum -c one.sum
          case "$name" in
            *.tar.gz) tar -xzf "$name"; exe=./wxbrief ;;
            *.exe) cp "$name" wxbrief.exe; exe=./wxbrief.exe ;;
          esac
          chmod +x "$exe"
          echo "EXE=$PWD/${exe#./}" >> "$GITHUB_ENV"
      - name: Run it
        run: |
          # No Python of ours on PATH is needed by the executable; the driver below uses the runner's Python.
          python scripts/post_release_check.py "$EXE" "$VERSION"
