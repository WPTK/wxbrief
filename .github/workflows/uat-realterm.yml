name: UAT real terminals

# Manual only. Drives the pinned wxbrief 0.3.0 release exe inside Windows Terminal (portable zip), legacy conhost and
# VS Code's integrated terminal (portable zip) on the interactive windows-2025 runner with SendInput + UI Automation,
# reads the screen back and uploads PNGs and text. Test-only: no secrets, read-only token, artifacts only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realterm:
    name: Real terminals (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      OUT: ${{ github.workspace }}\realterm-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install driver dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r tests/uat_realterm/requirements.txt
          New-Item -ItemType Directory -Force $env:OUT | Out-Null
      - name: Fetch and verify pinned tools
        shell: pwsh
        run: |
          foreach ($t in 'wxbrief','wt','vscode') {
            python tests/uat_realterm/fetch.py $t --dest "$env:RUNNER_TEMP\realterm-tools\$t" | Tee-Object -FilePath "$env:OUT\fetch-$t.json"
            if ($LASTEXITCODE -ne 0) { throw "fetch $t failed" }
          }
      - name: Session and desktop facts
        shell: pwsh
        run: |
          [Environment]::OSVersion | Out-String
          "UserInteractive: $([Environment]::UserInteractive)  User: $env:USERNAME"
          whoami /groups | Select-String 'Mandatory|Administrators'
          reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v EnableLUA
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | ForEach-Object { "$($_.DeviceName) $($_.Bounds)" }
      - name: Conhost
        if: always()
        shell: pwsh
        run: |
          $w = Get-Content "$env:OUT\fetch-wxbrief.json" | ConvertFrom-Json
          python tests/uat_realterm/run_spike.py conhost --wxbrief $w.exe --out "$env:OUT" 2>&1 | Tee-Object -FilePath "$env:OUT\run-conhost.log"
          exit $LASTEXITCODE
      - name: Windows Terminal
        if: always()
        shell: pwsh
        run: |
          $w = Get-Content "$env:OUT\fetch-wxbrief.json" | ConvertFrom-Json
          $t = Get-Content "$env:OUT\fetch-wt.json" | ConvertFrom-Json
          python tests/uat_realterm/run_spike.py wt --wxbrief $w.exe --tool-exe $t.exe --out "$env:OUT" 2>&1 | Tee-Object -FilePath "$env:OUT\run-wt.log"
          exit $LASTEXITCODE
      - name: VS Code integrated terminal
        if: always()
        shell: pwsh
        run: |
          $w = Get-Content "$env:OUT\fetch-wxbrief.json" | ConvertFrom-Json
          $t = Get-Content "$env:OUT\fetch-vscode.json" | ConvertFrom-Json
          python tests/uat_realterm/run_spike.py vscode --wxbrief $w.exe --tool-exe $t.exe --out "$env:OUT" 2>&1 | Tee-Object -FilePath "$env:OUT\run-vscode.log"
          exit $LASTEXITCODE
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem "$env:OUT\result-*.json") {
            $r = Get-Content $f | ConvertFrom-Json
            "### $($r.terminal): passed=$($r.passed) in $($r.runtime_s)s" | Add-Content $env:GITHUB_STEP_SUMMARY
            foreach ($s in $r.steps) { if ($null -ne $s.ok) { "- $(if ($s.ok) {'PASS'} else {'FAIL'}) $($s.step) $($s.detail)" | Add-Content $env:GITHUB_STEP_SUMMARY } }
          }
          Get-Process | Where-Object { $_.ProcessName -match 'WindowsTerminal|OpenConsole|conhost|Code|wxbrief' } | Select-Object Id, ProcessName | Format-Table | Out-String
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: realterm-out
          path: realterm-out
          if-no-files-found: warn
          retention-days: 14
