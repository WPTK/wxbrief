name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['CHANGELOG.md', 'CONTRIBUTING.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['CHANGELOG.md', 'CONTRIBUTING.md', 'docs/**', 'LICENSE']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Every Python that requires-python (>=3.12) lets a user install on is tested and required.
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m vulture wxbrief scripts --min-confidence 80
      - run: python -m mypy wxbrief
      - run: python -m pytest -n auto
      - run: python -m wxbrief --version
      - run: python -m wxbrief decode --plain "METAR KDEN 131453Z 06007KT 3/4SM R35L/P6000FT BR OVC003 09/08 A3001 RMK AO2 SFC"

  build:
    name: Build (wheel and sdist)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "build>=1,<2" "twine>=6,<7"
      - run: python -m build --outdir dist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  install:
    name: Install ${{ matrix.kind }} (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        kind: [wheel, sdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # A clean environment outside the checkout: only the built file and its dependencies are installed.
      - name: Install into a clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "${{ matrix.kind }}" = wheel ]; then file=$(ls dist/*.whl); else file=$(ls dist/*.tar.gz); fi
          if [ "$RUNNER_OS" = Windows ]; then py="$RUNNER_TEMP/venv/Scripts/python"; else py="$RUNNER_TEMP/venv/bin/python"; fi
          "$py" -m pip install "$file"
          echo "VENV_PY=$py" >> "$GITHUB_ENV"
      - name: Check the installed copy (entry point, CLI, package data via importlib.resources)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: '"$VENV_PY" -I "$GITHUB_WORKSPACE/scripts/ci_check_install.py"'

  readme:
    name: README commands (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "build>=1,<2"
      - run: python -m build --wheel --outdir wheel
      # Runs every command of the README in an empty directory. Only the GitHub-release download is replaced (by the
      # wheel built above); the pipx/uv routes and the .exe/.tar.gz downloads are not in the README, and the binaries
      # are smoke-tested by the Release workflow and by post-release.yml.
      - run: python scripts/readme_commands.py --wheel-dir wheel

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Audits what a user gets: the resolved runtime dependencies, not the dev tools. A finding fails the job; fix
      # it by raising the bound or file an issue, do not add an ignore without one.
      - name: Resolve the runtime dependencies
        run: |
          python -m venv rt
          rt/bin/python -m pip install .
          rt/bin/python -m pip freeze --exclude wxbrief > runtime.txt
          cat runtime.txt
      - run: python -m pip install "pip-audit>=2.7,<3"
      - run: python -m pip_audit -r runtime.txt --no-deps --disable-pip --strict
