name: Feature request
description: Suggest an addition or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do
      description: The problem or use case, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
      description: What you would like wxbrief to do. Check docs/plan.md first; it may already be planned.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
