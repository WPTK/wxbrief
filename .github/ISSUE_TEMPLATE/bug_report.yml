name: Bug report
description: Something decodes wrongly or does not work as described
labels: [bug]
body:
  - type: textarea
    id: report
    attributes:
      label: Raw report
      description: The METAR, SPECI or TAF text, exactly as received. Leave blank if the bug is not about a report.
      render: text
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, the output you got, and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python -m wxbrief --version`, or the commit if running from source.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, Python 3.12.10
    validations:
      required: true
